# LiBot ROS 2 Jazzy Nav2 parameters — mecanum MPPI profile
# Frame tree: map -> odom -> base_footprint -> base_link -> laser
# Mecanum wheel centers are +/-0.135 m in X and +/-0.165 m in Y.
# With a 0.30 m chassis and 0.035 m wheel width, the footprint is 0.33 x 0.365 m.
# Nav2 adds 0.015 m footprint padding on every side.
# navigation.launch.py starts only the Nav2 nodes configured in this file.
# Collision Monitor is launched by robot.launch.py and forwards /cmd_vel to
# /cmd_vel_safe. The STM32 bridge subscribes only to the safe output.
# Hardware and Gazebo expose mecanum motion in vx, vy, and wz.

amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    use_sim_time: false
    base_frame_id: base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::OmniMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.1
    update_min_d: 0.1
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    # Gazebo and Nav2 share one container in the simulation profile. Leave
    # enough time for action acknowledgements when the simulator is under load.
    default_server_timeout: 1000
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    default_nav_to_pose_bt_xml: /ros2_ws/src/libot_bringup/behavior_trees/navigate_to_pose.xml
    default_nav_through_poses_bt_xml: /ros2_ws/src/libot_bringup/behavior_trees/navigate_through_poses.xml
    error_code_names:
    - compute_path_error_code
    - follow_path_error_code
controller_server:
  ros__parameters:
    # MPPI model_dt is 0.05 s, so its control period must also be 0.05 s.
    controller_frequency: 20.0
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    # Treat a blocked controller as persistent only after five seconds. This
    # matches the progress checker so transient obstacles can move away first.
    failure_tolerance: 5.0
    publish_zero_velocity: true
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    use_realtime_priority: false
    progress_checker:
      # Count both translation and rotation as progress. The simple checker
      # only measures XY distance and can abort while the robot is correctly
      # rotating to the requested final yaw at the goal.
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.05
      required_movement_angle: 0.10
      # Trigger controller recovery promptly when a new obstacle leaves the
      # robot stationary. Rotation still counts as progress with this checker.
      movement_time_allowance: 5.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.20
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 56
      model_dt: 0.05
      batch_size: 1000
      iteration_count: 1
      temperature: 0.3
      gamma: 0.015
      open_loop: false
      visualize: false
      # Explore enough of the velocity range to reach the 0.35 m/s cruise target.
      vx_std: 0.20
      vy_std: 0.20
      wz_std: 0.20
      vx_max: 0.40
      vx_min: -0.40
      vy_max: 0.40
      wz_max: 1.0
      ax_max: 1.5
      ax_min: -1.5
      ay_max: 1.5
      ay_min: -1.5
      az_max: 4.0
      motion_model: Omni
      # These critics constrain mecanum motion. NavFn path poses do not carry
      # useful intermediate yaw values, so heading is derived from path points
      # by PathAngleCritic instead of PathAlignCritic.
      critics:
      - OmniConstraintCritic
      - MecanumCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      - TwirlingCritic
      OmniConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      MecanumCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        # 0.40 m/s wheel cap allows 0.35 m/s translation plus steering margin.
        vx_max: 0.40
        vy_max: 0.40
        wz_max: 1.33
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.8
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.2
        offset_from_furthest: 10
        threshold_to_consider: 0.5
        max_angle_to_furthest: 0.785
        mode: 0
      TwirlingCritic:
        enabled: true
        twirling_cost_power: 1
        twirling_cost_weight: 10.0
local_costmap:
  local_costmap:
    ros__parameters:
      initial_transform_timeout: 300.0
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: '[[0.165, 0.1825], [0.165, -0.1825], [-0.165, -0.1825], [-0.165, 0.1825]]'
      footprint_padding: 0.015
      plugins:
      - obstacle_layer
      - range_layer
      - inflation_layer
      filters:
      - keepout_filter
      keepout_filter:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: true
        filter_info_topic: /keepout_costmap_filter_info
        override_lethal_cost: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.05
      always_send_full_costmap: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.05
      range_layer:
        plugin: nav2_costmap_2d::RangeSensorLayer
        enabled: true
        topics:
        - /range/front
        - /range/left
        - /range/right
        - /range/rear
        input_sensor_type: VARIABLE
        clear_on_max_reading: true
        clear_threshold: 0.2
        mark_threshold: 0.8
        no_readings_timeout: 0.0
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 4.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      footprint: '[[0.165, 0.1825], [0.165, -0.1825], [-0.165, -0.1825], [-0.165, 0.1825]]'
      footprint_padding: 0.015
      plugins:
      - static_layer
      - obstacle_layer
      - range_layer
      - inflation_layer
      filters:
      - keepout_filter
      - speed_filter
      keepout_filter:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: true
        filter_info_topic: /keepout_costmap_filter_info
        override_lethal_cost: true
      speed_filter:
        plugin: nav2_costmap_2d::SpeedFilter
        enabled: true
        filter_info_topic: /speed_costmap_filter_info
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.05
      range_layer:
        plugin: nav2_costmap_2d::RangeSensorLayer
        enabled: true
        topics:
        - /range/front
        - /range/left
        - /range/right
        - /range/rear
        input_sensor_type: VARIABLE
        clear_on_max_reading: true
        clear_threshold: 0.2
        mark_threshold: 0.8
        # Gazebo currently has no ultrasonic publishers. Keeping this disabled
        # prevents an otherwise healthy simulated costmap becoming stale.
        no_readings_timeout: 0.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.05
      always_send_full_costmap: true
map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
planner_server:
  ros__parameters:
    expected_planner_frequency: 4.0
    planner_plugins:
    - GridBased
    costmap_update_timeout: 1.0
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.5
      use_astar: true
      allow_unknown: false
smoother_server:
  ros__parameters:
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - backup
    - wait
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 2.0
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 50.0
    stamp_smoothed_velocity_with_smoothing_time: false
    scale_velocities: true
    feedback: OPEN_LOOP
    max_velocity:
    - 0.40
    - 0.40
    - 1.0
    min_velocity:
    - -0.40
    - -0.40
    - -1.0
    max_accel:
    - 1.5
    - 1.5
    - 4.0
    max_decel:
    - -1.5
    - -1.5
    - -4.0
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 1.0
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ''
