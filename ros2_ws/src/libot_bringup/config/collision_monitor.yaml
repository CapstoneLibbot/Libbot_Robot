collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel
    cmd_vel_out_topic: /cmd_vel_safe
    state_topic: /collision_monitor_state
    transform_tolerance: 0.5
    source_timeout: 0.5
    base_shift_correction: true
    stop_pub_timeout: 1.0
    enable_stamped_cmd_vel: false


    polygons:
    - FootprintApproach
    FootprintApproach:
      type: velocity_polygon
      action_type: approach
      time_before_collision: 0.8
      simulation_time_step: 0.05
      min_points: 3
      visualize: true
      polygon_pub_topic: /collision_monitor/footprint_approach
      enabled: true
      holonomic: false
      velocity_polygons:
      - rotation
      - forward
      - backward
      rotation:
        # Nav2 footprint is +/-0.165 m after padding; add 0.05 m on every side.
        points: '[[0.215, 0.215], [0.215, -0.215], [-0.215, -0.215], [-0.215, 0.215]]'
        linear_min: -0.01
        linear_max: 0.01
        theta_min: -1.0
        theta_max: 1.0
      forward:
        points: '[[0.215, 0.215], [0.215, -0.215], [-0.215, -0.215], [-0.215, 0.215]]'
        linear_min: 0.01
        linear_max: 0.5
        theta_min: -1.0
        theta_max: 1.0
      backward:
        points: '[[0.215, 0.215], [0.215, -0.215], [-0.215, -0.215], [-0.215, 0.215]]'
        linear_min: -0.5
        linear_max: -0.01
        theta_min: -1.0
        theta_max: 1.0

    observation_sources:
    - scan
    scan:
      type: scan
      topic: /scan
      source_timeout: 0.5
      enabled: true
