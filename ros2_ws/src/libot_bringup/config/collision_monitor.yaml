collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel
    cmd_vel_out_topic: /cmd_vel_safe
    state_topic: /collision_monitor_state
    transform_tolerance: 0.5
    source_timeout: 0.5
    base_shift_correction: true
    stop_pub_timeout: 1.0
    enable_stamped_cmd_vel: false


    polygons:
    - FootprintApproach
    FootprintApproach:
      type: velocity_polygon
      action_type: approach
      time_before_collision: 0.8
      simulation_time_step: 0.05
      min_points: 3
      visualize: true
      polygon_pub_topic: /collision_monitor/footprint_approach
      enabled: true
      holonomic: true
      velocity_polygons:
      - rotation
      - forward
      - forward_left
      - left
      - backward_left
      - backward
      - backward_right
      - right
      - forward_right
      - stopped
      rotation:
        points: '[[0.165, 0.165], [0.165, -0.165], [-0.165, -0.165], [-0.165, 0.165]]'
        linear_min: 0.0
        linear_max: 0.03
        direction_start_angle: -3.14159
        direction_end_angle: 3.14159
        theta_min: -0.65
        theta_max: 0.65
      forward:
        points: '[[0.405, 0.255], [0.405, -0.255], [-0.165, -0.255], [-0.165, 0.255]]'
        linear_min: 0.03
        linear_max: 0.5
        direction_start_angle: -0.392699
        direction_end_angle: 0.392699
        theta_min: -0.65
        theta_max: 0.65
      forward_left:
        points: '[[0.405, 0.405], [0.405, -0.165], [-0.165, -0.165], [-0.165, 0.405]]'
        linear_min: 0.03
        linear_max: 0.30
        direction_start_angle: 0.392699
        direction_end_angle: 1.178097
        theta_min: -0.65
        theta_max: 0.65
      left:
        points: '[[0.255, 0.405], [0.255, -0.165], [-0.255, -0.165], [-0.255, 0.405]]'
        linear_min: 0.03
        linear_max: 0.30
        direction_start_angle: 1.178097
        direction_end_angle: 1.963495
        theta_min: -0.65
        theta_max: 0.65
      backward_left:
        points: '[[0.165, 0.405], [0.165, -0.255], [-0.405, -0.255], [-0.405, 0.405]]'
        linear_min: 0.03
        linear_max: 0.30
        direction_start_angle: 1.963495
        direction_end_angle: 2.748894
        theta_min: -0.65
        theta_max: 0.65
      backward:
        points: '[[0.165, 0.255], [0.165, -0.255], [-0.405, -0.255], [-0.405, 0.255]]'
        linear_min: 0.03
        linear_max: 0.30
        direction_start_angle: 2.748894
        direction_end_angle: -2.748894
        theta_min: -0.65
        theta_max: 0.65
      backward_right:
        points: '[[0.165, 0.165], [0.165, -0.405], [-0.405, -0.405], [-0.405, 0.165]]'
        linear_min: 0.03
        linear_max: 0.30
        direction_start_angle: -2.748894
        direction_end_angle: -1.963495
        theta_min: -0.65
        theta_max: 0.65
      right:
        points: '[[0.255, 0.165], [0.255, -0.405], [-0.255, -0.405], [-0.255, 0.165]]'
        linear_min: 0.03
        linear_max: 0.30
        direction_start_angle: -1.963495
        direction_end_angle: -1.178097
        theta_min: -0.65
        theta_max: 0.65
      forward_right:
        points: '[[0.405, 0.165], [0.405, -0.405], [-0.165, -0.405], [-0.165, 0.165]]'
        linear_min: 0.03
        linear_max: 0.30
        direction_start_angle: -1.178097
        direction_end_angle: -0.392699
        theta_min: -0.65
        theta_max: 0.65
      stopped:
        points: '[[0.75, 0.75], [0.75, -0.75], [-0.75, -0.75], [-0.75, 0.75]]'
        linear_min: 0.0
        linear_max: 1.0
        direction_start_angle: -3.14159
        direction_end_angle: 3.14159
        theta_min: -1.0
        theta_max: 1.0

    observation_sources:
    - scan
    scan:
      type: scan
      topic: /scan
      source_timeout: 0.5
      enabled: true
