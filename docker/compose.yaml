services:

  ros2:

    build:
      context: ..
      dockerfile: docker/Dockerfile

    container_name: libot_ros2

    network_mode: host

    restart: unless-stopped

    devices:
      - "/dev/rplidar:/dev/rplidar"
      - "/dev/serial0:/dev/serial0" # uart stm32

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../ros2_ws/src:/ros2_ws/src
      - ../maps:/ros2_ws/maps
      - ../logs:/ros2_ws/logs

    environment:
        DISPLAY: "${DISPLAY}"
        QT_X11_NO_MITSHM: "1"
        ROS_DOMAIN_ID: "0"

    # command:
    #   - bash
    command:
      - tail
      - -f
      - /dev/null