x-ros2-common: &ros2-common
  build:
    context: ..
    dockerfile: docker/Dockerfile
    network: host
  network_mode: host
  restart: unless-stopped
  volumes:
    - ../ros2_ws/src:/ros2_ws/src
    - ../robot_app:/ros2_ws/robot_app
    - ../maps:/ros2_ws/maps
    - ../logs:/ros2_ws/logs
  environment:
    ROS_DOMAIN_ID: "0"
    LIBOT_BACKEND_URL: "${LIBOT_BACKEND_URL:-http://127.0.0.1:5205}"

services:
  ros2-hardware:
    <<: *ros2-common
    profiles: [hardware]
    container_name: libot_ros2_hardware
    devices:
      - "/dev/rplidar:/dev/rplidar"
      - "/dev/serial0:/dev/serial0"
    command: >-
      bash -lc "source /opt/ros/jazzy/setup.bash && source /ros2_ws/install/setup.bash &&
      ros2 launch libot_bringup robot_control.launch.py"

  ros2-simulation:
    <<: *ros2-common
    profiles: [simulation]
    container_name: libot_ros2_simulation
    network_mode: bridge
    ports:
      - "9001:9001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ROS_DOMAIN_ID: "0"
      LIBOT_RUNTIME_ID: sim
      LIBOT_TCP_PORT: "9001"
      LIBOT_BACKEND_URL: "${LIBOT_BACKEND_URL:-http://host.docker.internal:5205}"
    command: >-
      bash -lc "source /opt/ros/jazzy/setup.bash && source /ros2_ws/install/setup.bash &&
      ros2 launch libot_bringup simulation_navigation.launch.py
      backend_url:=$${LIBOT_BACKEND_URL}"
